name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      YOLO_CONFIG_DIR: /tmp/ultralytics
      YOLO_AUTOINSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and shell syntax
        run: |
          ruff check .
          bash -n scripts/deploy.sh
      - name: Unit and API tests (no GPU, private data, or checkpoint downloads)
        run: python -m pytest -q --junitxml=reports/junit.xml
      - name: Install CPU ML runtime
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ml.txt
          python -m pip check
      - name: Synthetic one-epoch training, validation, save and reload
        run: python -m scripts.smoke
      - name: Build CPU image (no dataset or weights in image)
        run: docker build --pull -t yolo-api:ci .
      - name: Container readiness and real-model API smoke
        run: |
          set -euo pipefail
          trap 'docker logs yolo-smoke || true; docker rm -f yolo-smoke || true' EXIT
          docker run -d --name yolo-smoke \
            -p 127.0.0.1:18000:8000 --read-only --tmpfs /tmp:size=512m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e API_TOKEN=ci-only-key-012345678901234567890123456789 \
            -e MODEL_MIN_MAP=0 -e ALLOW_SMOKE_MODEL=1 \
            -v "$PWD/.ci/bundle:/models:ro" yolo-api:ci
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:18000/readyz; then break; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:18000/readyz
          curl -fsS --max-time 30 -H 'X-API-Key: ci-only-key-012345678901234567890123456789' \
            -F 'file=@.ci/dataset/images/val/0.png;type=image/png' \
            http://127.0.0.1:18000/predict > reports/container-prediction.json
          python -c "import json; assert isinstance(json.load(open('reports/container-prediction.json'))['detections'], list)"
      - name: Keep test reports only (never private training data or models)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: reports/
          retention-days: 7
          if-no-files-found: warn
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Publish tested source as an immutable-addressable image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          image="ghcr.io/16minsun-afk/yolo-api:sha-${GITHUB_SHA}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$image" .
          docker push "$image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
          printf '### Published CPU API image\n\n`%s`\n\nUse its sha256 digest in Deploy. No model is included.\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
