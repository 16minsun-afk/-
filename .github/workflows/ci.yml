name: Cross-Platform Python CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  compatibility-test:
    name: Test on ${{ matrix.os }} (Py ${{ matrix.python-version }})
    strategy:
      # 한 OS에서 에러가 나도 다른 OS 테스트를 중단하지 않고 끝까지 실행합니다.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
    # 1. 소스 코드 가져오기
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 매트릭스에 지정된 파이썬 버전 설치
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # OS별 의존성 캐싱으로 빌드 속도 향상

    # 3. 의존성 설치 (윈도우/리눅스/맥 호환을 위해 python -m pip 사용)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest  # 테스트 도구 강제 설치 예시
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      shell: bash # Windows에서도 bash 명령어가 통하도록 고정

    # 4. 크로스 플랫폼 테스트 실행
    - name: Run pytest
      run: |
        pytest
      shell: bash
