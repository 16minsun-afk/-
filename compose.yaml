name: yolo-api
services:
  api:
    image: ${IMAGE_REF:?Set IMAGE_REF in deployment.env}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      MODEL_DIR: /models
      MODEL_MIN_MAP: ${MODEL_MIN_MAP:-0.5}
    volumes:
      - type: bind
        source: ./models/${MODEL_VERSION:?Set MODEL_VERSION in deployment.env}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
